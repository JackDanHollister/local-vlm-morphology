[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traittrail-experiment"
version = "0.1.0"
description = "Local vision-model observations, saved specimen evidence and feature graphs"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["Pillow>=11,<14", "jsonschema>=4.20,<5"]
authors = [{name = "Jack D. Hollister"}, {name = "Steen Dupont"}]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
traittrail-experiment = "traittrail_experiment.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "docs/licenses/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traittrail_experiment = ["prompt.txt", "viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
